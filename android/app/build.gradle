plugins {
  id 'com.android.application'
}

android {
  namespace 'app.basirah.glasses'
  compileSdk 34

  defaultConfig {
    applicationId 'app.basirah.glasses'
    minSdk 24
    targetSdk 34
    versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    versionName = '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  }

  // Clé de la version BÊTA (dans le dépôt) : les mises à jour s'installent par-dessus. À remplacer avant une diffusion publique.
  signingConfigs {
    beta {
      storeFile file('../beta.keystore')
      storePassword 'basirahbeta'
      keyAlias 'basirah'
      keyPassword 'basirahbeta'
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.beta
      minifyEnabled false
    }
    debug {
      signingConfig signingConfigs.beta
    }
  }

  // Deux applications depuis le même code : lunettes (paysage, anneau) et téléphone (tactile, boutons à l'écran).
  flavorDimensions = ['device']
  productFlavors {
    glasses {
      dimension 'device'
      manifestPlaceholders = [orientation: 'landscape']
      resValue 'string', 'app_name', 'Basirah'
      resValue 'string', 'start_url', 'https://appassets.androidplatform.net/assets/www/glasses.html?glasses=1'
    }
    phone {
      dimension 'device'
      applicationIdSuffix '.phone'
      manifestPlaceholders = [orientation: 'unspecified']
      resValue 'string', 'app_name', 'Basirah (téléphone)'
      resValue 'string', 'start_url', 'https://appassets.androidplatform.net/assets/www/glasses.html?phone=1'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  androidResources {
    noCompress += ['onnx', 'wasm', 'txt', 'json', 'html', 'js', 'mjs']
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
