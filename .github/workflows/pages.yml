# Construit la page à chaque envoi sur GitHub et la publie (GitHub Pages). Aucune commande à lancer par vous.
# NB : GitHub Pages pour un dépôt PRIVÉ exige un compte payant ; sinon utiliser Netlify/Cloudflare (voir LISEZ-MOI-DEPLOIEMENT.md).
name: build-and-deploy
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm run build:app
      # Modèle Coran publié AVEC l'application (aucun téléchargement externe à l'exécution). Licence MIT (Abdou/quran-asr-tiny).
      # Si Hugging Face est injoignable, l'application se rabat sur Hugging Face au moment de l'utilisation.
      - name: Embarquer le modèle quran-asr-tiny
        continue-on-error: true
        run: |
          mkdir -p public/models/quran-asr-tiny
          for f in model.int8.onnx tokens.txt; do curl -fsSL --retry 3 -o public/models/quran-asr-tiny/$f https://huggingface.co/Abdou/quran-asr-tiny/resolve/main/$f; done
          ls -la public/models/quran-asr-tiny; head -40 public/models/quran-asr-tiny/tokens.txt
      # ONNX Runtime Web publié avec l'application (même origine : fonctionne hors ligne, même si le CDN est bloqué).
      - name: Embarquer ONNX Runtime Web 1.27.0
        continue-on-error: true
        run: |
          mkdir -p public/vendor/ort
          for f in ort.wasm.min.js ort-wasm-simd-threaded.wasm ort-wasm-simd-threaded.mjs; do curl -fsSL --retry 3 -o public/vendor/ort/$f https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/$f; done
          ls -la public/vendor/ort
      # Application Android pour les lunettes (INMO Air 2) : page lunettes + modèle + ONNX Runtime à l'intérieur (100 % hors ligne).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Construire l'APK lunettes
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets/www
          cp public/glasses.html android/app/src/main/assets/www/
          cp -r public/models public/vendor android/app/src/main/assets/www/
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk public/basirah-glasses.apk
          ls -la public/basirah-glasses.apk
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
